- link:
    ~/.config: 
      path: src/.config
      force: true
    ~/.zshrc: 
      path: src/.zshrc
      force: true
    ~/.gitconfig: 
      path: src/.gitconfig
      force: true
    ~/.tmux.conf: 
      path: src/.tmux.conf
      force: true
    ~/.aerospace.toml: 
      path: src/.aerospace.toml
      force: true

- shell:
  -
    command: xcode-select --install
    stdout: true
  -
    command: brew update
    stdout: true
  -
    command: brew tap homebrew/cask-fonts
    stdout: true
  -
    command: brew install --cask font-hack-nerd-font
    stdout: true
  -
    command: brew install lua 
    stdout: true
  -
    command: brew install ripgrep 
    stdout: true
  -
    command: brew install btop 
    stdout: true
  -
    command: brew install git-delta 
    stdout: true
  -
    command: brew install tmux 
    stdout: true
    description: Installing tmux
  -
    command: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
    stdout: true
    description: Installing tmux plugin manager !Remember to install plugins with prefix + I
  -
    command: brew install nvim 
    stdout: true
  -
    command: brew install node 
    stdout: true
  -
    command: brew install --cask raycast
    stdout: true
    description: Installing raycast
  -
    command: sh -c "$(curl -fsSL https://raw.github.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" 
    stdout: true
    description: Installing oh-my-zsh
  -
    command: npm i -g vscode-langservers-extracted 
    stdout: true
    description: Installing vscode language server
  -
    command: npm install -g typescript typescript-language-server
    stdout: true
    description: Installing typescript language server
  -
    command: sh -c 'curl -fLo "${XDG_DATA_HOME:-$HOME/.local/share}"/nvim/site/autoload/plug.vim --create-dirs \
       https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim'
    stdout: true
    description: Installing Vim Plug for nvim
  -
    command: brew install --cask nikitabobko/tap/aerospace
    stdout: true
    description: Installing Aerospace for macos
  -
    command: curl -sfL https://raw.githubusercontent.com/ducaale/xh/master/install.sh | sh
    stdout: true
    description: Installing curl replacement xh
