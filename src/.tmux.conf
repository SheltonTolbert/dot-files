bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g mouse on
set -g status on

set-option -sg escape-time 10
set-option -g focus-events on

# Bind arrow keys for resizing panes while holding the leader
bind -r Up resize-pane -U  # Resize pane up
bind -r Down resize-pane -D  # Resize pane down
bind -r Left resize-pane -L  # Resize pane left
bind -r Right resize-pane -R  # Resize pane right


# Plugins

## Status bar
# set -g @plugin 'thewtex/tmux-mem-cpu-load'
set -g @plugin 'erikw/tmux-powerline'

## Floating window
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-border-color 'default'
set -g @floax-text-color 'default'

## FZF control
set -g @plugin 'sainnhe/tmux-fzf'
## prefix + f

## URL opener
set -g @plugin 'wfxr/tmux-fzf-url' 
## prefix + u 

## Session switcher
set -g @plugin 'vndmp4/tmux-fzf-session-switch'
set -g @fzf-goto-session 'b'
set-option -g @fzf-goto-session-only 'true'
## prefix + s

## Slack notifications
## Need a slack api key stored in $TMUX_PLUGIN_MANAGER_PATH/tmux-slack-counter/token
set -g @plugin 'x4121/tmux-slack-counter'

# Plugin config
# set -g status-interval 2
# set -g status-right '#[fg=green]#($TMUX_PLUGIN_MANAGER_PATH/tmux-mem-cpu-load/tmux-mem-cpu-load --colors --powerline-right --interval 2)#[default]'
# set -g status-left-length 60


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
