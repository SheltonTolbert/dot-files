- link:
    ~/.config: 
      path: src/.config
      force: true
    ~/.zshrc: 
      path: src/.zshrc
      force: true
    ~/.gitconfig: 
      path: src/.gitconfig
      force: true
    ~/.gitignore: 
      path: src/.gitignore
      force: true
    ~/.tmux.conf: 
      path: src/.tmux.conf
      force: true
    ~/.aerospace.toml: 
      path: src/.aerospace.toml
      force: true

